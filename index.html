<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#075DCE" />
    <meta
      name="description"
      content="EasyDry Laundrys — professional laundry care, picked up and delivered at your doorstep."
    />
    <title>EasyDry Laundrys · A little less laundry. A little more life.</title>
    <style>
      #startup-screen {
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 32px;
        text-align: center;
        background: #f8f9fb;
        color: #14233c;
        font-family: Roboto, Arial, sans-serif;
      }
      #startup-screen h1 {
        font-size: 32px;
        letter-spacing: -1.5px;
        color: #075dce;
        margin: 0 0 8px;
      }
      #startup-screen small {
        font-size: 10px;
        letter-spacing: 4px;
        color: #626f80;
      }
      #startup-message {
        font-size: 14px;
        line-height: 1.6;
        max-width: 300px;
        margin-top: 30px;
      }
      #startup-reload {
        margin-top: 20px;
        padding: 14px 24px;
        border: 0;
        border-radius: 10px;
        background: #075dce;
        color: #fff;
        font-size: 14px;
        min-height: 48px;
      }
      #startup-details {
        font-size: 12px;
        line-height: 1.6;
        max-width: 320px;
        margin-top: 20px;
        overflow-wrap: anywhere;
        color: #626f80;
      }
    </style>
    <script>
      (function () {
        function report(message) {
          var screen = document.getElementById("startup-screen");
          if (!screen) return;
          document.getElementById("startup-message").textContent =
            "EasyDry could not finish loading. Please refresh to try again.";
          document.getElementById("startup-reload").hidden = false;
          var details = document.getElementById("startup-details");
          details.hidden = false;
          details.textContent = String(
            message || "A required app file could not be loaded.",
          );
        }
        window.addEventListener(
          "error",
          function (event) {
            if (event.message) report(event.message);
            else if (event.target && event.target.tagName === "SCRIPT")
              report(
                "An app file could not load. Check your hotspot connection and refresh.",
              );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          report((event.reason && event.reason.message) || event.reason);
        });
        window.setTimeout(function () {
          if (!document.getElementById("startup-screen")) return;
          document.getElementById("startup-message").textContent =
            "Loading is taking longer than expected. Check your hotspot connection, then try again.";
          document.getElementById("startup-reload").hidden = false;
        }, 15000);
      })();
    </script>
  </head>
  <body style="margin: 0">
    <div id="root">
      <div id="startup-screen" role="status" aria-live="polite">
        <h1>EasyDry</h1>
        <small>LAUNDRYS</small>
        <p id="startup-message">
          A little less laundry. A little more life.<br />Loading your fresh
          start…
        </p>
        <button
          id="startup-reload"
          type="button"
          hidden
          onclick="window.location.reload()"
        >
          Refresh EasyDry
        </button>
        <p id="startup-details" hidden></p>
        <noscript
          >Please enable JavaScript in your browser to open EasyDry.</noscript
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
